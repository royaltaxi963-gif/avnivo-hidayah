  const card=lessonEl("article","learn-card"+(expanded?" open":""));
  const head=lessonEl("button","learn-card-head");head.type="button";head.dataset.lesson=i;head.setAttribute("aria-expanded",String(expanded));
  head.append(lessonEl("span","learn-card-num",lessonDone.has(key)?"✓":String(i+1)));
  const title=lessonEl("span","learn-card-title");title.append(lessonEl("strong","",lesson[0]),lessonEl("small","",lesson[1]));
  head.append(title,lessonEl("span","learn-chevron","›"));card.append(head);
  if(expanded){
   const body=lessonEl("div","learn-body");
   lesson[2].forEach(line=>{
    const p=lessonEl("p",line.startsWith("Arabcha:")||line.startsWith("Арабча:")?"arabic-verse":"",line);
    if(line.startsWith("Arabcha:")||line.startsWith("Арабча:")){p.lang="ar";p.textContent=line.split(":").slice(1).join(":").trim()}
    body.append(p);
   });
   if(lesson[3])body.append(lessonEl("p","note",lesson[3]));
   const complete=lessonEl("button","learn-complete"+(lessonDone.has(key)?" done":""),lessonDone.has(key)?d.undo:d.done);
   complete.type="button";complete.dataset.complete=key;body.append(complete);card.append(body);
  }
  list.append(card);
 });
}
$("learnTabs").addEventListener("click",e=>{
 const b=e.target.closest("[data-tab]");if(!b)return;
 learnTab=Number(b.dataset.tab);openLesson=-1;renderPrayer();
 $("lessonScroll").scrollTo({top:0,behavior:reduced()?"instant":"smooth"});
});
$("learnList").addEventListener("click",e=>{
 const complete=e.target.closest("[data-complete]");
 if(complete){const key=complete.dataset.complete;lessonDone.has(key)?lessonDone.delete(key):lessonDone.add(key);saveLessons();renderPrayer();return}
 const b=e.target.closest("[data-lesson]");if(!b)return;
 const i=Number(b.dataset.lesson);openLesson=openLesson===i?-1:i;renderPrayer();
});
$("prayerBack").addEventListener("click",()=>history.back());
function openPrayer(){
 learnTab=0;openLesson=-1;renderPrayer();
 history.pushState({page:"prayerLearn"},"",location.href);show("prayerLearn");
}
$("prayerNav").addEventListener("click",e=>{
 const b=e.target.closest("[data-go]");if(!b)return;
 const id=b.dataset.go;
 if(id==="home"){navigate("home");return}
 renderDetail(id);history.pushState({page:"detail",id},"",location.href);show("detail");
});
const DETAIL_IDS=["prayer","book","compass","beads","ai","times","reminders","settings","dates"];
function detailText(id){
 const cy=lang==="uz-Cyrl";
 const text={
 "prayer":[0,cy?"Намозни ўрганиш бўлими кейинги босқичда ишга туширилади.":"Namozni o‘rganish bo‘limi keyingi bosqichda ishga tushiriladi."],
 "book":[1,cy?"Дуолар ва суралар бўлими кейинги босқичда ишга туширилади.":"Duolar va suralar bo‘limi keyingi bosqichda ishga tushiriladi."],
 "compass":[3,cy?"Қибла компаси кейинги босқичда ишга туширилади.":"Qibla kompasi keyingi bosqichda ishga tushiriladi."],
 "beads":[4,cy?"Тасбеҳ бўлими кейинги босқичда ишга туширилади.":"Tasbeh bo‘limi keyingi bosqichda ishga tushiriladi."],
 "ai":[0,cy?"AI савол-жавоб бўлими кейинги босқичда ишга туширилади.":"AI savol-javob bo‘limi keyingi bosqichda ishga tushiriladi."],
 "times":[1,cy?"Намоз вақтлари кейинги босқичда уланади.":"Namoz vaqtlari keyingi bosqichda ulanadi."],
 "reminders":[4,cy?"Эслатмалар кейинги босқичда уланади.":"Eslatmalar keyingi bosqichda ulanadi."],
 "settings":[0,cy?"Созламалар кейинги босқичда уланади.":"Sozlamalar keyingi bosqichda ulanadi."],
 "dates":[1,cy?"Сана тақвими кейинги босқичда уланади.":"Sana taqvimi keyingi bosqichda ulanadi."]
 };
 const headings={
 times:cy?"Намоз вақтлари":"Namoz vaqtlari",
 reminders:cy?"Эслатмалар":"Eslatmalar",
 settings:cy?"Созламалар":"Sozlamalar",
 dates:cy?"Бугунги сана":"Bugungi sana"
 };
 const [i,desc]=text[id]||text.ai;
 return {title:headings[id]||tr().items[i].title,desc,icon:icon[id]||icon.ai};
}
function renderDetail(id){
 updateActiveTab(id);
 const item=detailText(id);
 $("detailTitle").textContent=item.title;
 $("detailDesc").textContent=item.desc;
 $("detailSymbol").innerHTML=item.icon;
 $("detailBack").textContent=tr().back;
}
$("home").addEventListener("click",e=>{
 const b=e.target.closest("[data-go]");if(!b)return;
 const id=b.dataset.go;
 if(id==="home")return;
 if(id==="prayer"){openPrayer();return}
 if(id==="profile"){$("name").value=person?.name||"";$("age").value=person?.age||"";navigate("profile");return}
 renderDetail(id);history.pushState({page:"detail",id},"",location.href);show("detail");
});
$("detailBack").addEventListener("click",()=>history.back());
$("detailNav").addEventListener("click",e=>{
 const b=e.target.closest("[data-go]");if(!b)return;
 const id=b.dataset.go;
 if(id==="home"){navigate("home");return}
 if(id==="prayer"){openPrayer();return}
 if(history.state?.page==="detail"&&history.state?.id===id)return;
 renderDetail(id);history.pushState({page:"detail",id},"",location.href);show("detail");
});

$("language").addEventListener("change",e=>setLanguage(e.target.value));
$("profileForm").addEventListener("submit",e=>{
 e.preventDefault();
 const name=$("name").value.trim().replace(/\s+/g," "),age=Number($("age").value);
 if([...name].length<2||[...name].length>40){$("error").textContent=tr().errorName;return}
 if(!$("age").value.trim()||!Number.isInteger(age)||age<5||age>120){$("error").textContent=tr().errorAge;return}
 person={name,age,lang};$("error").textContent="";navigate("tour",0);
});
$("next").addEventListener("click",()=>{
 if($("tour").querySelector(".center").getAnimations({subtree:false}).length)return;
 if(step<ids.length-1)navigate("tour",step+1);
 else{person.lang=lang;safeSet(KEY,JSON.stringify(person));navigate("home")}
});
$("back").addEventListener("click",()=>history.back());
window.addEventListener("popstate",e=>{
 if(!ready)return;
 const s=e.state;
 if(s&&["profile","tour","home","detail","prayerLearn"].includes(s.page)){
  const nextIndex=Math.max(0,Math.min(ids.length-1,Number(s.index)||0));
  if(s.page==="tour"&&page==="tour"){switchTour(nextIndex,nextIndex>=step?1:-1);return}
  ++tourSequence;
  step=nextIndex;
  if(s.page==="tour")renderTour();
  if(s.page==="home")renderHome();
  if(s.page==="detail")renderDetail(s.id||"ai");
  if(s.page==="prayerLearn")renderPrayer();
  show(s.page);
 }else{
  // Keep Android back predictable even if history returns to a pre-app entry.
  if(page==="tour"){++tourSequence;step=0;show("profile")}
 }
});
function begin(){
 if(ready)return;ready=true;
 loadLessons();
 $("prayerNav").innerHTML=$("detailNav").innerHTML;
 for(const b of $("prayerNav").querySelectorAll(".nav-item")){b.classList.toggle("selected",b.dataset.go==="home")};
 $("splash").hidden=true;
 person=saved();
 const initial=person?"home":"profile";
 lang=person?.lang||(I18N[safeGet(LANG_KEY)]?safeGet(LANG_KEY):"uz-Latn");
 setLanguage(lang);
 history.replaceState({page:initial,index:0},"",location.href);
 if(person)renderHome();
 show(initial);
}
window.setTimeout(begin,3000);
</script>
</body>
</html>
