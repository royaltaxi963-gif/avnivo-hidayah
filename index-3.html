<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050d1b">
<title>AVNIVO HIDAYAH</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050d1b;color:#f4f1e9}
#splash{position:fixed;inset:0;z-index:10;background:#050d1b;display:flex;align-items:center;justify-content:center}
#splash img{display:block;width:100%;height:100%;object-fit:contain}
#home{min-height:100svh;padding:calc(26px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#0b2432,#06141d)}
header{font-weight:700;letter-spacing:.18em;font-size:14px;color:#eac781}h1{font-size:32px;margin:38px 0 8px}p{color:#c5d2d3;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:28px}
.tile{background:#13333c;border:1px solid #a78d55;border-radius:16px;padding:24px 12px;text-align:center;min-height:92px;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:14px}
.small{font-size:12px;color:#aebdbd;margin-top:28px}
</style>
</head>
<body>
<div id="splash" aria-label="AVNIVO HIDAYAH kirish rasmi"><img src="./splash.png" alt="Hidayah — AVNIVO" fetchpriority="high"></div>
<main id="home" hidden>
<header>AVNIVO · <span lang="ar" dir="rtl">هداية</span></header>
<h1>HIDAYAH</h1>
<p>Ibodat va diniy bilimlarni o‘rganish</p>
<div class="grid">
<div class="tile">Namoz o‘rganish</div><div class="tile">Qibla</div>
<div class="tile">Namoz vaqtlari</div><div class="tile">Muqaddas kunlar</div>
<div class="tile">Duolar va zikrlar</div><div class="tile">AI savol-javob</div>
</div>
<p class="small">Bu bosh sahifa hozircha namuna. Bo‘limlar keyingi bosqichda ishga tushiriladi.</p>
</main>
<script>
'use strict';
// Exactly three seconds after page initialization; no animation or sound.
window.setTimeout(function(){
  document.getElementById('splash').hidden=true;
  document.getElementById('splash').style.display='none';
  document.getElementById('home').hidden=false;
},3000);
</script>
</body>
</html>
