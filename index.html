<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030a17">
<title>AVNIVO — هداية</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#030a17;color:#fff;font-family:system-ui,sans-serif}
#intro{position:fixed;inset:0;overflow:hidden;background:#030a17}
#screen{display:block;width:100%;height:100%}
#controls{position:absolute;inset:0;display:grid;place-items:end center;padding:0 18px calc(35px + env(safe-area-inset-bottom));pointer-events:none}
#start,#replay{pointer-events:auto;background:#0a1b30dd;border:1px solid #e8c67a;color:#fff1d1;border-radius:30px;padding:14px 23px;font-size:15px;box-shadow:0 0 30px #0008}
#replay{display:none}
#note{position:absolute;bottom:calc(100px + env(safe-area-inset-bottom));left:12%;width:76%;text-align:center;color:#f5e8c8;font-size:13px;text-shadow:0 2px 9px #000}
#home{display:none;min-height:100svh;padding:35px 22px;background:linear-gradient(#0c3036,#04151d)}
#home h1{font-size:32px;margin:50px 0 10px}#home p{color:#cfdfdf}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}
.grid div{padding:24px 10px;background:#164047;border:1px solid #a58b5a;border-radius:14px;text-align:center;font-size:14px}
#home button{margin-top:24px;background:#d4b16e;border:0;border-radius:20px;padding:12px 18px;color:#132323}
@media(prefers-reduced-motion:reduce){#note:after{content:" (Harakatni kamaytirish sozlamasi faol)"}}
</style>
</head>
<body>
<section id="intro">
<canvas id="screen" role="img" aria-label="Hidayah rasmi: kamera pastdan yuqoriga qaraydi, rasmdagi oltin yo‘l yoritilib markazga yetadi, so‘ng rasmning oy va yozuvlari yorishadi"></canvas>
<div id="controls"><button id="start">Ovoz bilan animatsiyani boshlash</button><button id="replay">Qayta ko‘rish</button></div>
<div id="note">Brauzer ovoz ijrosi uchun birinchi bosishni talab qiladi.</div>
</section>
<main id="home"><header>AVNIVO · <span lang="ar">هداية</span></header><h1>HIDAYAH</h1><p>Diniy bilimlar va ibodatni o‘rganish.</p>
<div class="grid"><div>Namoz o‘rganish</div><div>Qibla</div><div>Namoz vaqtlari</div><div>Muqaddas kunlar</div><div>Duolar va zikrlar</div><div>AI savol-javob</div></div>
<p>Bo‘limlar hali prototip holatida, funksiyalar keyin ulanadi.</p><button id="again">Kirishni qayta ko‘rish</button></main>
<script>
'use strict';
/* Barcha vizual effektlar aynan scene.webp piksellaridan olinadi.
   Qo'shimcha chiziq, oy, logo yoki bezak chizilmaydi. */
const img=new Image(); img.src='./scene.webp';
const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d',{alpha:false});
const intro=document.getElementById('intro'),home=document.getElementById('home');
const start=document.getElementById('start'),replay=document.getElementById('replay'),note=document.getElementById('note');
const DURATION=5000; let raf=0,begin=0,playing=false,audio=null,voices=[];
const W=941,H=1672;
const ease=t=>t*t*(3-2*t),clamp=t=>Math.max(0,Math.min(1,t));
const mix=(a,b,t)=>a+(b-a)*t;
let litCanvas=null,litCtx=null;
function makeLit(){
 const c=document.createElement('canvas');c.width=W;c.height=H;
 const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(img,0,0,W,H);
 const pix=g.getImageData(0,0,W,H),d=pix.data;
 // Source-image gold and blue pixels are selectively illuminated, never new shapes.
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  let i=(y*W+x)*4,r=d[i],gr=d[i+1],b=d[i+2];
  const gold=r>gr*1.15&&gr>b*1.15&&r>75;
  const blue=b>r*1.22&&b>gr*.98&&b>70;
  if(gold){d[i]=Math.min(255,r*1.28+18);d[i+1]=Math.min(255,gr*1.32+11);d[i+2]=Math.min(255,b*1.15+5)}
  if(blue){d[i]=Math.min(255,r*1.10+5);d[i+1]=Math.min(255,gr*1.28+10);d[i+2]=Math.min(255,b*1.38+14)}
 }
 g.putImageData(pix,0,0);litCanvas=c;litCtx=g;
}
function size(){
 const dpr=Math.min(window.devicePixelRatio||1,2);
 canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);
}
function sourceCamera(t){
 // Floor close-up first, camera tilts and pulls back to full composition.
 const a=ease(clamp(t/.72)), aspect=canvas.width/canvas.height, original=W/H;
 const zoom=mix(2.45,1.0,a);
 let sw=W/zoom,sh=H/zoom;
 if(aspect>original){sh=sw/aspect;if(sh>H){sh=H;sw=H*aspect}}
 else{sw=sh*aspect;if(sw>W){sw=W;sh=W/aspect}}
 const cy=mix(1320,H/2,a),cx=W/2;
 return {sx:Math.max(0,Math.min(W-sw,cx-sw/2)),sy:Math.max(0,Math.min(H-sh,cy-sh/2)),sw,sh};
}
function pathPosition(t){
 // Sampled coordinates of the existing glowing road, bottom to center portal.
 const pts=[[90,1540],[175,1430],[290,1300],[430,1180],[570,1080],[630,1010],[600,960],[490,923],[420,895],[465,865],[480,835]];
 const f=clamp(t)*(pts.length-1),i=Math.min(pts.length-2,Math.floor(f)),q=ease(f-i);
 return [mix(pts[i][0],pts[i+1][0],q),mix(pts[i][1],pts[i+1][1],q)];
}
function draw(t){
 if(!img.complete||!img.naturalWidth)return;
 const cw=canvas.width,ch=canvas.height,cam=sourceCamera(t);
 ctx.clearRect(0,0,cw,ch);
 ctx.save();ctx.drawImage(img,cam.sx,cam.sy,cam.sw,cam.sh,0,0,cw,ch);
 // Entire source image starts dim and becomes clear when the light reaches portal.
 const arrival=ease(clamp((t-.59)/.21));
 ctx.fillStyle=`rgba(1,7,19,${mix(.69,.08,arrival)})`;ctx.fillRect(0,0,cw,ch);
 if(litCanvas){
  const progress=ease(clamp((t-.04)/.57));
  const [px,py]=pathPosition(progress);
  // Only reveal brightened pixels of the image along the EXISTING road.
  ctx.save();ctx.beginPath();
  const radius=48;
  const steps=Math.max(1,Math.floor(progress*180));
  for(let i=0;i<=steps;i++){
   const [x,y]=pathPosition(i/180);
   const dx=(x-cam.sx)/cam.sw*cw,dy=(y-cam.sy)/cam.sh*ch;
   const rx=radius/cam.sw*cw,ry=radius/cam.sh*ch;
   ctx.moveTo(dx+rx,dy);ctx.ellipse(dx,dy,rx,ry,0,0,Math.PI*2);
  }
  ctx.clip();
  ctx.globalAlpha=.88;
  ctx.drawImage(litCanvas,cam.sx,cam.sy,cam.sw,cam.sh,0,0,cw,ch);
  ctx.restore();
  // After reaching the portal, illuminate the source artwork as a whole.
  if(arrival>0){
   ctx.save();ctx.globalAlpha=arrival*.9;
   ctx.drawImage(litCanvas,cam.sx,cam.sy,cam.sw,cam.sh,0,0,cw,ch);
   ctx.restore();
  }
 }
 // Brightness pulsing only over existing source-image pixels.
 if(t>.72){
  const pulse=(Math.sin((t-.72)*Math.PI*11)+1)*.5;
  ctx.save();ctx.globalAlpha=.08*pulse;
  ctx.drawImage(litCanvas||img,cam.sx,cam.sy,cam.sw,cam.sh,0,0,cw,ch);
  ctx.restore();
 }
 ctx.restore();
}
function frame(now){
 if(!playing)return;
 const t=clamp((now-begin)/DURATION);
 draw(t);
 if(t<1){raf=requestAnimationFrame(frame)}
 else{playing=false;replay.style.display='inline-block';setTimeout(showHome,450)}
}
function showHome(){if(playing)return;intro.style.display='none';home.style.display='block'}
function stopVoices(){for(const o of voices){try{o.stop()}catch(e){}}voices=[]}
function tone(f,at,len,volume,shape='sine',to=f){
 if(!audio)return;
 const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+at;
 o.type=shape;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,to),t+len);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.06);
 g.gain.exponentialRampToValueAtTime(.0001,t+len);
 o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+len+.02);voices.push(o);
}
function sound(){
 // Original, instrumental-only, gentle ambient sound. Not Quran/adhan/music recording.
 tone(95,0,2.9,.017,'sine',330);tone(185,.25,2.6,.009,'triangle',510);
 tone(196,2.9,1.7,.042);tone(294,3.04,1.6,.029);tone(392,3.18,1.5,.022);
 tone(588,3.45,1.15,.015);
}
async function play(){
 cancelAnimationFrame(raf);stopVoices();home.style.display='none';intro.style.display='block';
 start.style.display='none';replay.style.display='none';note.style.display='none';
 if(window.AudioContext||window.webkitAudioContext){
  try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();await audio.resume();sound()}
  catch(err){console.warn('Ovoz yoqilmadi:',err)}
 }
 playing=true;begin=performance.now();raf=requestAnimationFrame(frame);
}
start.addEventListener('click',play);replay.addEventListener('click',play);
document.getElementById('again').addEventListener('click',play);
window.addEventListener('resize',()=>{size();if(!playing)draw(1)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){cancelAnimationFrame(raf);stopVoices();playing=false;replay.style.display='inline-block'}});
img.onload=()=>{makeLit();size();draw(0)};
img.onerror=()=>{note.textContent='scene.webp topilmadi. Fayl index.html bilan bir papkada bo‘lishi kerak.'};
size();
</script>
</body></html>
