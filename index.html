 {id:"sana",title:"Sano",ar:"سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ وَتَبَارَكَ اسْمُكَ وَتَعَالَى جَدُّكَ وَلَا إِلَهَ غَيْرُكَ",latin:"Subhanakallohumma va bihamdika va tabarokasmuka va ta’ala jadduka va la ilaha g‘oyruk",meaning:"Allohim, Sen poksan, Senga hamd bo‘lsin; isming barakotli, ulug‘liging yuksak, Sendan boshqa iloh yo‘q."},
 {id:"ruku",title:"Ruku tasbehi",ar:"سُبْحَانَ رَبِّيَ الْعَظِيمِ",latin:"Subhana robbiyal-’aziym",meaning:"Ulug‘ Rabbim barcha nuqsonlardan pokdir."},
 {id:"rise",title:"Rukudan turish",ar:"سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ",latin:"Sami’allohu liman hamidah",meaning:"Alloh Unga hamd aytgan kishini eshitdi."},
 {id:"hamd",title:"Hamd",ar:"رَبَّنَا لَكَ الْحَمْدُ",latin:"Robbana lakal-hamd",meaning:"Rabbimiz, hamd Senga xosdir."},
 {id:"sajda",title:"Sajda tasbehi",ar:"سُبْحَانَ رَبِّيَ الْأَعْلَى",latin:"Subhana robbiyal-a’la",meaning:"Eng oliy Rabbim barcha nuqsonlardan pokdir."},
 {id:"tashahhud",title:"Attahiyyat",ar:"التَّحِيَّاتُ لِلَّهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ",latin:"Attahiyyatu lillahi vas-solavatu vat-toyyibat...",meaning:"Barcha salomlar, ibodatlar va pok so‘zlar Alloh uchundir. Payg‘ambarga, bizga va solih bandalarga salom bo‘lsin. Allohdan boshqa iloh yo‘qligiga va Muhammad Uning bandasi va elchisi ekaniga guvohlik beraman."},
 {id:"salam",title:"Salom",ar:"السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ",latin:"Assalomu alaykum va rohmatulloh",meaning:"Sizlarga Allohning salomi va rahmati bo‘lsin."}
];
const QURAN_CLIPS=[
 {name:"Fotiha — الفاتحة",surah:1,meaning:"Mehribon va rahmli Alloh nomi bilan. Hamd olamlarning Rabbi Allohgadir. U mehribon va rahmlidir, jazo kunining Egasi. Faqat Sengagina ibodat qilamiz va Sendangina yordam so‘raymiz. Bizni to‘g‘ri yo‘lga hidoyat qil: ne’mat berganlaring yo‘liga, g‘azabga uchraganlar va adashganlar yo‘liga emas."},
 {name:"Ixlos — الإخلاص",surah:112,meaning:"Ayting: U Alloh yagonadir. Alloh behojatdir. U tug‘magan va tug‘ilmagan. Unga hech kim teng emas."}
];
function prayerSegments(topic){
 const cy=lang==="uz-Cyrl";
 return (SCHOOL_PARTS[topic]||[]).map(([name,n],i)=>({
  name:cy?({"Sunnat":"Суннат","Farz":"Фарз","Vitr (vojib)":"Витр (вожиб)","Qazo farz":"Қазо фарз","Sunnat (g‘ayri muakkad)":"Суннат (ғайри муаккад)"}[name]||name):name,
  count:n,index:i
 }));
}
function schoolExtra(root,topic){
 const t=schoolT(),cy=lang==="uz-Cyrl";
 if(topic>=2){
  const seg=el("section","school-extra");
  seg.append(el("h3","",cy?"Суннат, фарз ва ракъатлар":"Sunnat, farz va rak’atlar"));
  const desc=el("p","",cy?"Ҳар бир қисм алоҳида ният ва такбир билан бошланади.":"Har bir qism alohida niyat va takbir bilan boshlanadi.");
  seg.append(desc);
  prayerSegments(topic).forEach(({name,count,index})=>{
   const item=el("div","school-rakat");
   item.append(el("strong","",`${index+1}. ${name} — ${count} ${cy?"ракъат":"rak’at"}`));
   const intention=cy?
    `Қалбингизда Аллоҳ учун ${t.tabs[topic]} намозининг ${count} ракъат ${name.toLowerCase()} қисмини ўқишни ният қилинг. Сўнг «Аллоҳу акбар» деб бошланг.`:
    `Qalbingizda Alloh uchun ${t.tabs[topic]} namozining ${count} rak’at ${name.toLowerCase()} qismini o‘qishni niyat qiling. So‘ng «Allohu akbar» deb boshlang.`;
   item.append(el("p","",intention));
   item.append(el("p","",cy?
    `1–2-ракъат: Фотиҳа ва қўшимча сура, руку, икки сажда. ${count>2?"Иккинчи ракъатдан кейин ўтириш. ":""}Охирги ўтиришда ташаҳҳуд, саловат ва дуодан кейин салом.`
    :`1–2-rak’at: Fotiha va qo‘shimcha sura, ruku, ikki sajda. ${count>2?"Ikkinchi rak’atdan keyin o‘tirish. ":""}Oxirgi o‘tirishda tashahhud, salovat va duodan keyin salom.`));
   seg.append(item);
  });
  root.append(seg);
 }
 const phrases=el("section","school-extra");
 phrases.append(el("h3","",cy?"Арабча зикрлар ва маънолари":"Arabcha zikrlar va ma’nolari"));
 for(const p of PHRASES){
  const row=el("details","school-phrase");
  const sum=el("summary","",p.title);row.append(sum);
  const arabic=el("p","school-phrase-ar",p.ar);arabic.lang="ar";arabic.dir="rtl";
  row.append(arabic,el("p","",p.latin),el("p","",p.meaning));phrases.append(row);
 }
 root.append(phrases);
 const audio=el("section","school-extra");
 audio.append(el("h3","",cy?"Қуръон тиловати — қори овози":"Qur’on tilovati — qori ovozi"));
 audio.append(el("p","",cy?"Мишарий Рашид Алафасий. Интернет талаб қилинади.":"Mishari Rashid Alafasy. Internet talab qilinadi."));
 for(const clip of QURAN_CLIPS){
  const item=el("div","school-rakat");
  item.append(el("strong","",clip.name));
  const player=el("audio","school-audio-player");player.controls=true;player.preload="none";
  player.src=`https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${clip.surah}.mp3`;
  player.addEventListener("error",()=>{status.textContent=cy?"Аудиони юклаб бўлмади. Интернетни текширинг.":"Audio yuklanmadi. Internetni tekshiring."});
  const status=el("small","school-audio-status","");
  item.append(player,status,el("p","",clip.meaning));audio.append(item);
 }
 root.append(audio);
 const notice=el("p","school-caution",cy?
 "Эслатма: аёллар ва эркаклар намозининг айрим ҳаракатларида ҳанафий фиқҳида тафовутлар бор. Тасвирий ҳаракатлар ҳали диний мутахассис томонидан тасдиқланмаган; уларни тўлиқ 3D дарс деб қабул қилманг.":
 "Eslatma: ayollar va erkaklar namozining ayrim harakatlarida hanafiy fiqhida tafovutlar bor. Tasviriy harakatlar hali diniy mutaxassis tomonidan tasdiqlanmagan; ularni to‘liq 3D dars deb qabul qilmang.");
 root.append(notice);
}
function renderPrayer(){
 $("prayerContent").querySelectorAll("audio").forEach(a=>a.pause());
 const t=schoolT(),root=$("prayerContent");
 $("prayerBack").textContent=t.back;
 root.replaceChildren();
 const heading=el("div","school-heading");
 heading.append(el("div","learn-eyebrow","AVNIVO · هداية"),el("h1","",t.title),el("p","",schoolLevel===0?t.choose:schoolLevel===1?(schoolGender==="men"?t.menDesc:t.womenDesc):t.guide));
 root.append(heading);
 if(schoolLevel===0){
  const grid=el("div","school-choices");
  ["men","women"].forEach(g=>{
   const btn=el("button","school-gender");btn.type="button";btn.dataset.gender=g;
   const art=el("span","school-gender-art");art.innerHTML=PERSON_ICON(g);
   btn.append(art,el("strong","",t[g]),el("small","",t[g+"Desc"]));grid.append(btn);
  });root.append(grid);return;
 }
 if(schoolLevel===1){
  const list=el("div","school-topics");
  t.tabs.forEach((name,i)=>{
   const btn=el("button","school-topic");btn.type="button";btn.dataset.topic=i;
   const n=el("span","school-topic-num",String(i+1).padStart(2,"0"));
   const title=el("span","school-topic-title");title.append(el("strong","",name),el("small","",PRAYER_AR[i]));
   btn.append(n,title,el("span","school-topic-arrow","›"));list.append(btn);
  });root.append(list);return;
 }
 const topic=schoolTopic,lines=t.explanations[topic];
 const hero=el("div","school-lesson-title");hero.append(el("div","school-ar",PRAYER_AR[topic]),el("h2","",t.tabs[topic]),el("p","",t.info));root.append(hero);
 const tabs=el("div","school-stepper");
 lines.forEach((_,i)=>{const b=el("button",i===schoolStep?"current":"",String(i+1));b.type="button";b.dataset.step=i;b.setAttribute("aria-label",`${t.step} ${i+1}`);tabs.append(b)});root.append(tabs);
 const card=el("article","school-step-card");
 card.append(el("span","learn-eyebrow",`${t.step} ${schoolStep+1} / ${lines.length}`));
 card.append(el("p","school-instruction",lines[schoolStep]));
 const posture=topic===0?0:topic===1?1:Math.min(schoolStep,4);
 const demo=el("div","school-demo");
 demo.append(el("div","school-demo-label",t.posture));
 const scene=el("div","school-stage");
 const figure=el("div",`school-figure pose-${posture} ${schoolGender}`);
 figure.innerHTML='<span class="figure-head"></span><span class="figure-body"></span><span class="figure-arm left"></span><span class="figure-arm right"></span><span class="figure-leg left"></span><span class="figure-leg right"></span>';
 scene.append(figure);demo.append(scene,el("small","school-demo-note",t.demo));card.append(demo);
 const note=el("div","school-audio");note.append(el("strong","",t.audio),el("p","",lang==="uz-Cyrl"?"Қуйида Фотиҳа ва Ихлос сураларининг қори овозидаги аудиоси бор.":"Quyida Fotiha va Ixlos suralarining qori ovozidagi audiosi bor."));card.append(note);
 const controls=el("div","school-controls");
 const prev=el("button","",t.back);prev.type="button";prev.dataset.move="-1";prev.disabled=schoolStep===0;
 const next=el("button","",schoolStep===lines.length-1?(lang==="uz-Cyrl"?"Тугатиш":"Tugatish"):(lang==="uz-Cyrl"?"Кейингиси →":"Keyingisi →"));next.type="button";next.dataset.move="1";
 controls.append(prev,next);card.append(controls);root.append(card);schoolExtra(root,topic);
}
$("prayerContent").addEventListener("click",e=>{
 const gender=e.target.closest("[data-gender]");
 if(gender){schoolGender=gender.dataset.gender;schoolTopic=0;schoolStep=0;schoolNav(1);return}
 const topic=e.target.closest("[data-topic]");
 if(topic){schoolTopic=Number(topic.dataset.topic);schoolStep=0;schoolNav(2);return}
 const step=e.target.closest("[data-step]");
 if(step){schoolStep=Number(step.dataset.step);schoolNav(2);return}
 const move=e.target.closest("[data-move]");
 if(move){const next=schoolStep+Number(move.dataset.move);if(next>=schoolT().explanations[schoolTopic].length){schoolNav(1);return}schoolStep=Math.max(0,next);schoolNav(2)}
});
$("prayerBack").addEventListener("click",()=>history.back());
function openPrayer(){schoolLevel=0;schoolStep=0;schoolNav(0)}
$("prayerNav").addEventListener("click",e=>{
 const b=e.target.closest("[data-go]");if(!b)return;
 const id=b.dataset.go;
 if(id==="home"){navigate("home");return}
 renderDetail(id);history.pushState({page:"detail",id},"",location.href);show("detail");
});
const DETAIL_IDS=["prayer","book","compass","beads","ai","times","reminders","settings","dates"];
function detailText(id){
 const cy=lang==="uz-Cyrl";
 const text={
 "prayer":[0,cy?"Намозни ўрганиш бўлими кейинги босқичда ишга туширилади.":"Namozni o‘rganish bo‘limi keyingi bosqichda ishga tushiriladi."],
 "book":[1,cy?"Дуолар ва суралар бўлими кейинги босқичда ишга туширилади.":"Duolar va suralar bo‘limi keyingi bosqichda ishga tushiriladi."],
 "compass":[3,cy?"Қибла компаси кейинги босқичда ишга туширилади.":"Qibla kompasi keyingi bosqichda ishga tushiriladi."],
 "beads":[4,cy?"Тасбеҳ бўлими кейинги босқичда ишга туширилади.":"Tasbeh bo‘limi keyingi bosqichda ishga tushiriladi."],
 "ai":[0,cy?"AI савол-жавоб бўлими кейинги босқичда ишга туширилади.":"AI savol-javob bo‘limi keyingi bosqichda ishga tushiriladi."],
 "times":[1,cy?"Намоз вақтлари кейинги босқичда уланади.":"Namoz vaqtlari keyingi bosqichda ulanadi."],
 "reminders":[4,cy?"Эслатмалар кейинги босқичда уланади.":"Eslatmalar keyingi bosqichda ulanadi."],
 "settings":[0,cy?"Созламалар кейинги босқичда уланади.":"Sozlamalar keyingi bosqichda ulanadi."],
 "dates":[1,cy?"Сана тақвими кейинги босқичда уланади.":"Sana taqvimi keyingi bosqichda ulanadi."]
 };
 const headings={
 times:cy?"Намоз вақтлари":"Namoz vaqtlari",
 reminders:cy?"Эслатмалар":"Eslatmalar",
 settings:cy?"Созламалар":"Sozlamalar",
 dates:cy?"Бугунги сана":"Bugungi sana"
 };
 const [i,desc]=text[id]||text.ai;
 return {title:headings[id]||tr().items[i].title,desc,icon:icon[id]||icon.ai};
}
function renderDetail(id){
 updateActiveTab(id);
 const item=detailText(id);
 $("detailTitle").textContent=item.title;
 $("detailDesc").textContent=item.desc;
 $("detailSymbol").innerHTML=item.icon;
 $("detailBack").textContent=tr().back;
}
$("home").addEventListener("click",e=>{
 const b=e.target.closest("[data-go]");if(!b)return;
 const id=b.dataset.go;
 if(id==="home")return;
 if(id==="prayer"){openPrayer();return}
 if(id==="profile"){$("name").value=person?.name||"";$("age").value=person?.age||"";navigate("profile");return}
 renderDetail(id);history.pushState({page:"detail",id},"",location.href);show("detail");
});
$("detailBack").addEventListener("click",()=>history.back());
$("detailNav").addEventListener("click",e=>{
 const b=e.target.closest("[data-go]");if(!b)return;
 const id=b.dataset.go;
 if(id==="home"){navigate("home");return}
 if(id==="prayer"){openPrayer();return}
 if(history.state?.page==="detail"&&history.state?.id===id)return;
 renderDetail(id);history.pushState({page:"detail",id},"",location.href);show("detail");
});

$("language").addEventListener("change",e=>setLanguage(e.target.value));
$("profileForm").addEventListener("submit",e=>{
 e.preventDefault();
 const name=$("name").value.trim().replace(/\s+/g," "),age=Number($("age").value);
 if([...name].length<2||[...name].length>40){$("error").textContent=tr().errorName;return}
 if(!$("age").value.trim()||!Number.isInteger(age)||age<5||age>120){$("error").textContent=tr().errorAge;return}
 person={name,age,lang};$("error").textContent="";navigate("tour",0);
});
$("next").addEventListener("click",()=>{
 if($("tour").querySelector(".center").getAnimations({subtree:false}).length)return;
 if(step<ids.length-1)navigate("tour",step+1);
 else{person.lang=lang;safeSet(KEY,JSON.stringify(person));navigate("home")}
});
$("back").addEventListener("click",()=>history.back());
window.addEventListener("popstate",e=>{
 if(!ready)return;
 const s=e.state;
 if(s&&["profile","tour","home","detail","prayerLearn"].includes(s.page)){
  const nextIndex=Math.max(0,Math.min(ids.length-1,Number(s.index)||0));
  if(s.page==="tour"&&page==="tour"){switchTour(nextIndex,nextIndex>=step?1:-1);return}
  ++tourSequence;
  step=nextIndex;
  if(s.page==="tour")renderTour();
  if(s.page==="home")renderHome();
  if(s.page==="detail")renderDetail(s.id||"ai");
  if(s.page==="prayerLearn"){schoolLevel=Number(s.level)||0;schoolGender=s.gender==="women"?"women":"men";schoolTopic=Number(s.topic)||0;schoolStep=Number(s.step)||0;renderPrayer()}
  show(s.page);
 }else{
  // Keep Android back predictable even if history returns to a pre-app entry.
  if(page==="tour"){++tourSequence;step=0;show("profile")}
 }
});
function begin(){
 if(ready)return;ready=true;


 $("splash").hidden=true;
 person=saved();
 const initial=person?"home":"profile";
 lang=person?.lang||(I18N[safeGet(LANG_KEY)]?safeGet(LANG_KEY):"uz-Latn");
 setLanguage(lang);
 renderHome();
 history.replaceState({page:initial,index:0},"",location.href);
 if(person)renderHome();
 show(initial);
}
window.setTimeout(begin,3000);
</script>
</body>
</html>
